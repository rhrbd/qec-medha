const API='https://script.google.com/macros/s/AKfycbzS5Ol6KGT4sCpsgNoNHBDFivjj_fHI6BFPpDjihnx5X4XX_C_bYCKcamYkToVFmPrv-Q/exec';

function fmtD(ms){try{return new Date(ms).toLocaleDateString('en-GB',{timeZone:TZ,weekday:'short',day:'numeric',month:'short',year:'numeric'})}catch(e){return ''}}
function nw(s){return '<span class="nw">'+esc(s)+'</span>'}
function post1(body,ms){const ctl=typeof AbortController!=='undefined'?new AbortController():null;const t=setTimeout(()=>{if(ctl)ctl.abort()},ms||30000);
return fetch(API,{method:'POST',credentials:'omit',redirect:'follow',signal:ctl?ctl.signal:undefined,headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)})
.then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()}).then(x=>{try{return JSON.parse(x)}catch(e){const er=new Error('busy');er.busy=true;throw er}}).finally(()=>clearTimeout(t))}
// Google answers "too many scripts running" (an HTML page) when ~30 requests run at once: wait a random moment and retry
async function post(body,ms){for(let k=0;;k++){try{return await post1(body,ms)}catch(e){if(!e||!e.busy||k>=4)throw e;await new Promise(r=>setTimeout(r,700+Math.random()*1500*(k+1)))}}}

function devTxt(){try{const u=navigator.userAgent||'',m=re=>{const x=re.exec(u);return x?(x[1]||x[2]||''):null};let os='';
if(m(/Android ([\d]+)/)!==null)os='Android '+m(/Android ([\d]+)/);else if(/iPhone|iPad|iPod/.test(u)||(/Macintosh/.test(u)&&navigator.maxTouchPoints>1))os='iOS'+(m(/OS (\d+)_/)?' '+m(/OS (\d+)_/):'');else if(/Windows/.test(u))os='Windows';else if(/Mac OS X/.test(u))os='macOS';else if(/CrOS/.test(u))os='ChromeOS';else if(/Linux/.test(u))os='Linux';
let br='';if(/FBAN|FBAV|FB_IAB/.test(u))br='Facebook app';else if(/Instagram/.test(u))br='Instagram app';else if(m(/EdgA?\/(\d+)/)!==null)br='Edge '+m(/EdgA?\/(\d+)/);else if(/OPR\/|Opera/.test(u))br='Opera';else if(m(/SamsungBrowser\/(\d+)/)!==null)br='Samsung Internet '+m(/SamsungBrowser\/(\d+)/);else if(m(/CriOS\/(\d+)|Chrome\/(\d+)/)!==null)br='Chrome '+m(/CriOS\/(\d+)|Chrome\/(\d+)/);else if(m(/Firefox\/(\d+)/)!==null)br='Firefox '+m(/Firefox\/(\d+)/);else if(/Safari/.test(u))br='Safari';
const typ=/iPad|Tablet/.test(u)||(/Macintosh/.test(u)&&navigator.maxTouchPoints>1)?'tablet':(/Mobi|Android|iPhone/.test(u)?'mobile':'computer');

const sc=window.screen&&screen.width?screen.width+'x'+screen.height:'';const net=(navigator.connection&&navigator.connection.effectiveType)||'';

const tickInfo=()=>{const c=$('#cdn');if(c){const ms=j.opens-nowS();if(ms<=0){clearInterval(infoT);c.textContent='opening...';setTimeout(()=>peek(false),Math.random()*6000);return}const x=Math.floor(ms/1000);const d=Math.floor(x/86400),hh=Math.floor(x%86400/3600),m=Math.floor(x%3600/60),sc=x%60;
c.textContent=(d?d+'d ':'')+String(hh).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(sc).padStart(2,'0')}
const l=$('#left');if(l&&!demo&&!review){const ms=j.closes-nowS();if(ms<=0){clearInterval(infoT);peek(false);return}l.innerHTML='<span>Time left: <b class="nw">'+Math.floor(ms/60000)+' min '+String(Math.floor(ms/1000)%60).padStart(2,'0')+' sec</b></span>'}};
tickInfo();infoT=setInterval(tickInfo,1000)}
// ---------------------------------------------------------------- exam
async function start(tries){tries=tries||0;const b=$('#start');if(b){b.disabled=true;b.textContent=tries?'Opening... (try '+(tries+1)+')':'Opening the Question Paper...'}
try{const t0=Date.now();const j=await post({a:'exStart',roll:A.roll,pin:A.pin,ci:ci(),dev:(navigator.userAgent||'').replace(/\s+/g,' ').slice(0,80),att:(demo||review)?(ss('qec_att')||''):'',cls:review?(rvGet()||{}).cls:undefined,ver:review?(rvGet()||{}).ver:undefined},40000);
if(!j||!j.ok){if(j&&j.state==='submitted'){thanks(j.at,false);return}if(j&&j.state){if(b){b.disabled=false;b.innerHTML='Start Exam <span class="bn">(এক্সাম শুরু কর)</span> &rarr;'}if(j.state!=='review')peek(false);toast(j.message||'The exam is not open.');return}throw new Error((j&&j.message)||'failed')}
skew=j.now-Math.round((t0+Date.now())/2);openExam(j)}
catch(e){const net=!(e&&e.message)||/HTTP|abort|fetch|network|JSON|Unexpected/i.test(e.message);if(net&&tries<3){setTimeout(()=>start(tries+1),1500+Math.random()*2500*(tries+1));return}
if(b){b.disabled=false;b.textContent='Try Again →'}toast(!net?e.message:'Could not open the exam. Check your internet and tap again.',5000)}}
function openExam(j){clearInterval(infoT);P=j;token=j.token;att=j.att||'';if(demo||review)ss('qec_att',att);
const n=j.secs.reduce((s,x)=>s+x.qs.length,0);ans=(j.ans&&j.ans.length===n)?j.ans:'-'.repeat(n);sw=j.sw||0;
const loc=lsLoad();if(loc&&loc.a&&loc.a.length===n&&loc.a!==ans&&loc.t>(j.start||0)){ans=loc.a;sw=Math.max(sw,loc.sw||0);dirty=true}
let sg0=Math.max(+j.sg||0,loc&&loc.t>(j.start||0)?(+loc.sg||0):0);sg0=Math.min(Math.max(0,sg0),j.secs.length-1);if(sg0>(+j.sg||0))dirty=true;
finished=false;document.body.classList.add('noselect');$('#xtop').hidden=false;$('#xname').textContent=j.student.name+' · '+j.student.roll;
$('#tabs').innerHTML=j.secs.map((s,i)=>'<div class="tb" data-i="'+i+'"><span>'+esc(s.name)+'</span><small><span>Q'+s.from+' – Q'+s.to+'</span></small></div>').join('');
setLangs(j.secs,/\(EV\)/.test(j.student.clsv||''),demo);show(sg0);toTop();counts();clearInterval(clock);clock=setInterval(tickClock,500);tickClock();if(dirty)queueSave(500)}
const isBn=t=>/[\u0980-\u09FF]/.test(t);
function toTop(){try{if('scrollRestoration' in history)history.scrollRestoration='manual'}catch(e){}if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();window.scrollTo(0,0);requestAnimationFrame(()=>window.scrollTo(0,0));setTimeout(()=>window.scrollTo(0,0),250)}
function qf(t){return esc(t).replace(/&#39;(.{1,80}?)&#39;/g,'\u2018$1\u2019').replace(/&quot;(.{1,120}?)&quot;/g,'\u201C$1\u201D')}
let QL={},QM={};
function mf(t,math){let h=qf(t);if(!math)return h;
h=h.replace(/\[\s*\]/g,'<span class="bx" aria-label="blank box"></span>');h=h.replace(/([0-9\u09E6-\u09EF)\]]) [-\u2013] (?=[0-9\u09E6-\u09EF(\[])/g,'$1 \u2212 ');
return h.replace(/(^|[^0-9\u09E6-\u09EF\/.])([0-9\u09E6-\u09EF]{1,4})\/([0-9\u09E6-\u09EF]{1,4})(?![0-9\u09E6-\u09EF\/])/g,'$1<span class="frac" role="math" aria-label="$2 by $3"><span class="nu">$2</span><span class="de">$3</span></span>')}
function setLangs(secs,ev,dm){QL={};QM={};secs.forEach(s=>s.qs.forEach(q=>{QM[q.n]=s.name==='Math';QL[q.n]=s.name==='English'?'en':(s.name==='Math'?(dm?'both':(ev?'en':'bn')):'bn')}))}
function second(pair,l){pair=pair||['',''];return l==='both'&&pair[0]&&pair[1]&&pair[1]!==pair[0]?pair[1]:''}
function pk(pair,l){pair=pair||['',''];return l==='en'?(pair[1]||pair[0]||''):(pair[0]||pair[1]||'')}
function optHtml(q,k){const L='ABCD'[k];const t=pk(q.o[k],QL[q.n]),t2=second(q.o[k],QL[q.n]);const sel=ans.charAt(q.n-1)===L;
return '<button type="button" class="opt'+(sel?' sel':'')+'" data-q="'+q.n+'" data-l="'+L+'" aria-pressed="'+sel+'"><span class="l">'+L+'</span><span class="t"><b class="'+(isBn(t)?'bn':'en')+'">'+mf(t,QM[q.n])+'</b>'+(t2?'<small class="en">('+mf(t2,QM[q.n])+')</small>':'')+'</span></button>'}
function qHtml(q){const a=ans.charAt(q.n-1)!=='-';const t=pk([q.qb,q.qe],QL[q.n]),t2=second([q.qb,q.qe],QL[q.n]);
return '<div class="q'+(a?' ans':'')+'" id="q'+q.n+'"><div class="qt"><span class="qn">Q'+q.n+'.</span><div><div class="qb '+(isBn(t)?'bn':'en')+'">'+mf(t,QM[q.n])+'</div>'+(t2?'<div class="qe en">('+mf(t2,QM[q.n])+')</div>':'')+'</div><span class="mk" title="1 mark">[1]</span></div>'+
'<div class="opts">'+(q.o||[]).map((o,k)=>(o&&(o[0]||o[1]))?optHtml(q,k):'').join('')+'</div></div>'}
function show(i){cur=i;const s=P.secs[i];$('#tabs').querySelectorAll('.tb').forEach(b=>{const k=+b.dataset.i;b.className='tb'+(k===i?' now':(k<i?' done':''))});
const last=i===P.secs.length-1;
app.innerHTML=card((i===0?header(P.header):'')+'<div class="sec'+(finished?' lock':'')+'"><div class="sect"><h2>'+esc(s.name)+' <span class="bn" style="font-weight:600">('+esc(s.bn)+')</span></h2><span>Q'+s.from+' – Q'+s.to+'</span></div>'+
'<div class="pal">'+s.qs.map(q=>'<button type="button" data-go="'+q.n+'" class="'+(ans.charAt(q.n-1)!=='-'?'on':'')+'">'+q.n+'</button>').join('')+'</div>'+
s.qs.map(qHtml).join('')+'<div class="nav2">'+
(last?'<button class="btn amber wide" type="button" id="subEnd">Submit Exam</button>':'<button class="btn wide" type="button" data-next="'+(i+1)+'">Next: '+esc(P.secs[i+1].name)+' Section &rarr;</button>')+'</div></div>');
bindSec()}
function bindSec(){app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.q,b.dataset.l));
app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{const e=document.getElementById('q'+b.dataset.go);if(e)e.scrollIntoView({behavior:'smooth',block:'start'})});
app.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>confirmNext(+b.dataset.next));
const se=$('#subEnd');if(se)se.onclick=confirmSubmit}
function confirmNext(i){if(finished||i!==cur+1||i>=P.secs.length)return;closeModal();cur=i;lsSave();dirty=true;show(i);queueSave(200);toTop()}
function pick(n,L){if(finished||submitting)return;if(!P.secs[cur].qs.some(x=>x.n===n))return;if(P.deadline-nowS()<=0){timeUp();return}
ans=ans.slice(0,n-1)+L+ans.slice(n);lsSave();dirty=true;queueSave(Math.max(4000,25000-(Date.now()-lastSave)));
const box=document.getElementById('q'+n);if(box){const s=P.secs[cur];const q=s.qs.find(x=>x.n===n);if(q){const t=document.createElement('div');t.innerHTML=qHtml(q);box.replaceWith(t.firstChild);bindSec()}}
const pb=app.querySelector('[data-go="'+n+'"]');if(pb)pb.className=L!=='-'?'on':'';counts()}
function counts(){}
function setSv(cls,txt){const e=$('#sv');e.className='sv '+cls;e.querySelector('span').textContent=txt}
function queueSave(ms){clearTimeout(saveT);saveT=setTimeout(()=>{saveT=null;saveNow()},ms)}
async function saveNow(){if(!dirty||saving||finished)return;saving=true;const snap=ans;setSv('wait','Saving...');
try{const j=await post({a:'exSave',token:token,ans:snap,sw:sw,sg:cur,sc:svc+1},20000);
if(j&&j.ok){svc++;lastSave=Date.now();if(ans===snap)dirty=false;setSv('','Saved');if(j.now)skew=j.now-Date.now()}
else if(j&&j.reauth){await reauth();saving=false;return saveNow()}
else if(j&&j.submitted){finished=true;thanks(0,false)}
else if(j&&j.timeup){timeUp()}
else{setSv('bad','Not saved yet');queueSave(8000)}}
catch(e){setSv('bad','Offline - retrying');queueSave(6000+Math.random()*4000)}
finally{saving=false;if(dirty&&!finished)queueSave(4000)}}
async function reauth(){try{const rp=review?(rvGet()||{}):{};const j=await post({a:'exStart',roll:A.roll,pin:A.pin,dev:'reauth',ci:ci(),att:att,cls:rp.cls,ver:rp.ver},30000);if(j&&j.ok){if(P&&j.start&&P.start&&j.start!==P.start&&!demo&&!review){finished=true;location.reload();return}token=j.token;P.deadline=j.deadline}}catch(e){}}
function tickClock(){if(!P)return;const ms=P.deadline-nowS();const x=Math.max(0,Math.ceil(ms/1000));const m=Math.floor(x/60),s=x%60;
$('#tt').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');$('#timer').classList.toggle('low',ms<=300000&&ms>0);
if(ms<=0&&!finished)timeUp();if(dirty&&!saving&&!saveT&&Date.now()-lastSave>30000)queueSave(100)}
function timeUp(){if(finished)return;finished=true;clearInterval(clock);$('#tt').textContent='00:00';
app.querySelectorAll('.sec').forEach(s=>s.classList.add('lock'));overlay('<h3>Time Is Up</h3><p>Your answers are locked and are being submitted. Please keep this page open.</p>');lsSave();setTimeout(()=>doSubmit('auto',0),Math.random()*20000)}
function overlay(html){let m=$('#modal');if(!m){m=document.createElement('div');m.id='modal';m.className='modal';document.body.appendChild(m)}m.innerHTML='<div class="box">'+html+'</div>';m.hidden=false;return m}
function closeModal(){const m=$('#modal');if(m)m.hidden=true}
function confirmSubmit(){if(finished)return;const c=ans.replace(/-/g,'').length;
const m=overlay('<h3>Submit Your Exam?</h3><p>After submitting you cannot change your answers.</p><div class="row"><button class="ghost" id="no" type="button">Cancel</button><button class="btn amber" id="yes" type="button">Yes, Submit</button></div>');
$('#no').onclick=closeModal;$('#yes').onclick=()=>{finished=true;clearInterval(clock);overlay('<h3>Submitting...</h3><p>Please wait. Do not close this page.</p>');doSubmit('manual',0)}}
async function doSubmit(how,n){if(submitting&&n===0)return;submitting=true;lsSave();
try{const j=await post({a:'exSubmit',token:token,ans:ans,sw:sw,sg:cur,how:how,ci:ci()},30000);
if(j&&j.ok){submitting=false;closeModal();try{localStorage.removeItem(lsKey())}catch(e){}if(demo||review)ss('qec_att',null);thanks(j.at||nowS(),true);return}
if(j&&j.reauth){await reauth()}}
catch(e){}
const wait=Math.min(15000,2000*Math.pow(1.6,n))+Math.random()*2500;overlay('<h3>'+(how==='auto'?'Time Is Up':'Submitting...')+'</h3><p>Connection is slow. Trying again... Please keep this page open.</p>');
setTimeout(()=>doSubmit(how,n+1),wait)}
function thanks(at,fresh){finished=true;clearInterval(clock);clearInterval(infoT);closeModal();$('#xtop').hidden=true;$('#wm').hidden=true;document.body.classList.remove('noselect');
app.innerHTML='<div class="center">'+card('<div class="thanks"><img alt="QEC Academy" src="assets/logo.png?v=11" style="height:56px;width:auto;display:block;margin:0 auto 18px"><div class="big"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#0f7a49" stroke-width="2.8"><path d="M20 6 9 17l-5-5"/></svg></div>'+
'<h2>Your Exam Has Been Submitted</h2><p>Thank you for joining <b>QEC Academy Medha Onneshon Exam 2026</b>.</p>'+(at?'<p style="font-size:13.5px;color:var(--mut)">Submitted at '+nw(fmtT(at))+'</p>':'')+
(demo?'<p style="font-size:13.5px;color:var(--mut)">This was a practice exam. Nothing was recorded for any student.</p>':'<p style="font-size:13.5px;color:var(--mut)">Results will be announced on your dashboard.</p>')+
'<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px"><a class="btn" href="login.html" style="display:inline-flex;align-items:center;text-decoration:none">Back to Dashboard</a>'+(demo?'<button class="ghost" type="button" style="height:50px" onclick="location.reload()">Try the Demo Again</button>':'')+'</div></div>')+'</div>';window.scrollTo(0,0)}
function watermark(s){const t=(s.roll+'  '+s.name).replace(/[<&>]/g,'');const svg='<svg xmlns="http://www.w3.org/2000/svg" width="440" height="230"><text x="20" y="140" transform="rotate(-22 220 115)" font-family="sans-serif" font-size="15" font-weight="700" fill="#5b1462">'+t+'</text></svg>';
const w=$('#wm');w.style.backgroundImage='url("data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)+'")';w.hidden=false}
// ---------------------------------------------------------------- light proctoring
['copy','cut','paste','contextmenu','dragstart','selectstart'].forEach(ev=>document.addEventListener(ev,e=>{if(P&&!finished&&!(e.target&&e.target.closest&&e.target.closest('input'))){e.preventDefault()}}));
document.addEventListener('keydown',e=>{if(!P||finished)return;const k=(e.key||'').toLowerCase();if((e.ctrlKey||e.metaKey)&&['c','x','p','s','u','a'].indexOf(k)>=0){e.preventDefault();toast('This action is disabled during the exam.')}
if(k==='printscreen'){try{navigator.clipboard.writeText('')}catch(x){}toast('Screenshots are not allowed during the exam.')}});
document.addEventListener('visibilitychange',()=>{if(!P||finished)return;if(document.hidden){sw++;lsSave();dirty=true;try{if(token&&navigator.sendBeacon){navigator.sendBeacon(API,new Blob([JSON.stringify({a:'exSave',token:token,ans:ans,sw:sw,sg:cur})],{type:'text/plain'}))}}catch(e){}}
else{toast('Please stay on the exam page. Leaving the page is recorded.',4500);queueSave(300)}});
window.addEventListener('beforeunload',e=>{if(P&&!finished){lsSave();e.preventDefault();e.returnValue=''}});
window.addEventListener('online',()=>{if(dirty)queueSave(200)});
// ---------------------------------------------------------------- boot
const saved=ss('qec_auth');if(saved&&saved.roll&&saved.pin){A=saved;peek(false)}else loginView();
</script></body></html>
