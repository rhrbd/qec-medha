<style>
:root{--plum:#64176a;--plum2:#7d2486;--plumd:#3f0d45;--amber:#f3ae3c;--amberd:#e19a1d;--ink:#1d1623;--mut:#6b6172;--line:#ebe5ee;--bg:#f6f2f8;--card:#fff;--ok:#127a4a;--okbg:#e8f7ef;--warn:#8f5700;--warnbg:#fff6e5;--bad:#a3262a;--badbg:#fdecec;--r:16px;--sh:0 14px 40px -20px rgba(63,13,69,.35),0 2px 8px -4px rgba(63,13,69,.1)}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;overflow-wrap:break-word;hyphens:none;word-break:normal}
.bn{font-family:"Hind Siliguri","Plus Jakarta Sans",sans-serif}
[hidden]{display:none!important}
.top{background:linear-gradient(135deg,var(--plumd),var(--plum) 60%,var(--plum2));color:#fff;position:relative;overflow:hidden}
.top:before{content:"";position:absolute;inset:0;background:radial-gradient(700px 260px at 90% -20%,rgba(243,174,60,.35),transparent 65%)}
.bar{position:relative;max-width:1040px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{background:#fff;border-radius:12px;padding:6px 10px;display:inline-flex;box-shadow:0 6px 18px -8px rgba(0,0,0,.5)}
.logo img{height:36px;width:auto;display:block}
.cta{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;text-decoration:none;font:800 14px "Plus Jakarta Sans",sans-serif;color:#2d1500;background:linear-gradient(180deg,#ffc55a,var(--amber));padding:10px 18px;border-radius:999px;box-shadow:0 0 0 4px rgba(243,174,60,.25),0 10px 22px -8px rgba(243,174,60,.9);transition:.15s}
.cta:hover{transform:translateY(-1px);box-shadow:0 0 0 5px rgba(243,174,60,.3),0 12px 26px -8px rgba(243,174,60,1)}
.ghostl{color:#fff;text-decoration:none;font-weight:700;font-size:14px;white-space:nowrap;padding:9px 14px;border:1px solid rgba(255,255,255,.35);border-radius:999px}
.ghostl:hover{background:rgba(255,255,255,.12)}
.hero{position:relative;max-width:1040px;margin:0 auto;padding:10px 20px 74px}
h1{font-size:clamp(22px,3.4vw,32px);line-height:1.15;font-weight:800;letter-spacing:-.015em;text-wrap:balance}
h1 i{font-style:normal;color:var(--amber)}
.sub{margin-top:4px;font-size:clamp(14px,1.8vw,17px);font-weight:600;opacity:.92}
.lead{margin-top:10px;font-size:14.5px;color:rgba(255,255,255,.85);max-width:520px;text-wrap:balance}
main{width:100%;max-width:1040px;margin:-52px auto 0;padding:0 20px 28px;position:relative;flex:1}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid rgba(100,23,106,.07)}
.pad{padding:20px}
.narrow{max-width:520px;margin:0 auto}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:#f2edf5;border-radius:12px;padding:4px;margin-bottom:14px}
.seg button{border:0;background:none;border-radius:9px;padding:9px 6px;font:700 13.5px "Plus Jakarta Sans",sans-serif;color:var(--mut);cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center;justify-content:center}
.seg button[aria-selected=true]{background:#fff;color:var(--plum);box-shadow:0 2px 8px -3px rgba(63,13,69,.4)}
.field{display:flex;gap:10px}
.field>label,.field>div{flex:1;min-width:0}
input.in{width:100%;height:50px;border-radius:12px;border:1.5px solid var(--line);padding:0 14px;font:600 16px "Plus Jakarta Sans",sans-serif;color:var(--ink);outline:none;background:#fff;transition:.15s}
input.in:focus{border-color:var(--plum);box-shadow:0 0 0 4px rgba(100,23,106,.12)}
.btn{height:50px;border:0;border-radius:12px;padding:0 24px;font:800 15px "Plus Jakarta Sans",sans-serif;color:#fff;background:linear-gradient(135deg,var(--plum),var(--plum2));cursor:pointer;box-shadow:0 10px 20px -10px rgba(100,23,106,.8);white-space:nowrap;transition:.15s}
.btn:hover{transform:translateY(-1px)}.btn:disabled{opacity:.6;cursor:wait;transform:none}
.btn.amber{color:#2d1500;background:linear-gradient(180deg,#ffc55a,var(--amber));box-shadow:0 0 0 4px rgba(243,174,60,.22),0 10px 22px -8px rgba(243,174,60,.9)}
.hint{margin-top:10px;color:var(--mut);font-size:13px}
.lbl{display:block;margin-bottom:6px;font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.pinw{position:relative}.pinw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--plum);font:700 13px "Plus Jakarta Sans",sans-serif;cursor:pointer;padding:8px}
.nudge{margin-top:12px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 16px;border-radius:14px;background:linear-gradient(135deg,#fff4dc,#fff);border:1px solid #f5d795;font-weight:600;font-size:14px}
.nudge a{white-space:nowrap}
#results{margin-top:14px;display:grid;gap:12px}
.banner{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--r)}
.banner.ok{background:linear-gradient(135deg,#0f6b41,#15915a);color:#fff;box-shadow:var(--sh)}
.banner.warn{background:var(--warnbg);color:var(--warn);border:1px solid #f4dba6}
.banner.bad{background:var(--badbg);color:var(--bad);border:1px solid #f2c8c8}
.banner h2{font-size:16px;line-height:1.3;text-wrap:balance}.banner p{margin-top:2px;font-size:13.5px;opacity:.93}
.ico{flex:0 0 34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.2)}
.banner.warn .ico{background:#fde5b8}.banner.bad .ico{background:#f8d2d2}
.stuh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.tag{font:800 11.5px "Plus Jakarta Sans",sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--plum);background:#f1e6f3;padding:5px 10px;border-radius:999px;white-space:nowrap}
.elig{font:700 12.5px "Plus Jakarta Sans",sans-serif;color:var(--ok);background:var(--okbg);padding:5px 10px;border-radius:999px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:14px 16px 16px}
.kv{min-width:0;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff}
.kv .k{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.kv .v{margin-top:3px;font-size:15.5px;font-weight:700;line-height:1.35}
.kv small{display:block;font-weight:500;font-size:13px;color:var(--mut)}
.kv.roll{background:linear-gradient(135deg,#fff8ea,#fff);border-color:#f3d89c}
.roll .v{font-size:22px;letter-spacing:.05em;color:var(--plumd);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.copy{border:1px solid #ead7b0;background:#fff;border-radius:8px;padding:4px 9px;font:700 12px "Plus Jakarta Sans",sans-serif;color:var(--amberd);cursor:pointer;letter-spacing:0}
.mode{display:inline-flex;align-items:center;gap:7px}.dot{width:8px;height:8px;border-radius:50%}
.pend{padding:14px 16px}.pend ul{margin-top:10px;padding:0;list-style:none;display:grid;gap:6px}
.pend li{display:flex;justify-content:space-between;gap:10px;border:1px dashed #efd29a;background:#fffaf0;border-radius:10px;padding:8px 12px;font-weight:600;font-size:14px}
.pend li span{color:var(--mut)}
.again{justify-self:center;border:0;background:none;color:var(--plum);font:700 14px "Plus Jakarta Sans",sans-serif;cursor:pointer;padding:6px 10px}
.skel{height:96px;border-radius:var(--r);background:linear-gradient(90deg,#f1ecf3 25%,#faf7fb 37%,#f1ecf3 63%);background-size:400% 100%;animation:sh 1.2s ease infinite}
@keyframes sh{0%{background-position:100% 0}100%{background-position:0 0}}
.note{margin-top:14px;padding:14px 16px}
.note h3{font-size:14px;margin-bottom:6px;color:var(--plum)}.note p{font-size:13px;color:#4a3f53;margin-top:6px}
.help{margin-top:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;font-size:13.5px}
.wa{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;text-decoration:none;font:700 13.5px "Plus Jakarta Sans",sans-serif;color:#fff;background:#1fa855;padding:10px 14px;border-radius:10px}
a{color:var(--plum);font-weight:700}
footer{text-align:center;color:var(--mut);font-size:12px;padding:6px 16px 22px}
.err{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--badbg);color:var(--bad);font-size:13.5px;border:1px solid #f2c8c8}
/* dashboard */
.dash{display:grid;gap:14px;grid-template-columns:1fr}
.prof{padding:18px;display:flex;gap:14px;align-items:center}
.ph{flex:0 0 76px;width:76px;height:76px;border-radius:18px;background:linear-gradient(135deg,var(--plum),var(--plum2));color:#fff;display:grid;place-items:center;font:800 26px "Plus Jakarta Sans",sans-serif;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.prof h2{font-size:19px;line-height:1.25;text-wrap:balance}.prof .bnn{font-size:15px;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font:700 12px "Plus Jakarta Sans",sans-serif;background:#f4eef6;color:var(--plum);border-radius:999px;padding:4px 10px;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.sech{padding:14px 16px 0;font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--plum)}
.exam{background:linear-gradient(135deg,#fff8ea,#fff)}
.lnk{display:inline-flex;margin-top:6px;white-space:nowrap;text-decoration:none;font:700 13.5px "Plus Jakarta Sans",sans-serif;color:#fff;background:linear-gradient(135deg,var(--plum),var(--plum2));padding:9px 14px;border-radius:10px}
.acts{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 16px}
.ghost{border:1.5px solid var(--line);background:#fff;color:var(--plum);font:700 13.5px "Plus Jakarta Sans",sans-serif;padding:9px 14px;border-radius:10px;cursor:pointer;text-decoration:none;white-space:nowrap}
.upd{padding:0 16px 14px;color:var(--mut);font-size:12px}
@media(min-width:600px){.pad{padding:24px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:900px){.bar,.hero,main{padding-left:28px;padding-right:28px}.hero{padding-bottom:84px}.dash{grid-template-columns:5fr 6fr;align-items:start}.prof{padding:22px}.ph{flex-basis:92px;width:92px;height:92px;font-size:30px}}
@media(max-width:599px){.field{flex-direction:column}.btn{width:100%}.grid{grid-template-columns:1fr}.logo img{height:30px}.cta{padding:9px 14px;font-size:13px}.lead{display:none}.seg button{font-size:12.5px;gap:4px}.seg svg{display:none}}
@media print{.top{background:var(--plum)!important;-webkit-print-color-adjust:exact}.cta,.again,.copy{display:none}}

fetch(API+'?'+qs,{credentials:'omit',redirect:'follow',signal:ctl?ctl.signal:undefined}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(j=>{clearTimeout(t);res(j)},e=>{clearTimeout(t);rej(e)})});
const viaJsonp=()=>new Promise((res,rej)=>{const cb='qec_cb_'+Date.now()+'_'+Math.floor(Math.random()*1e6);const s=document.createElement('script');const done=()=>{try{delete window[cb]}catch(e){window[cb]=undefined}s.remove()};
const t=setTimeout(()=>{done();rej(new Error('timeout'))},timeoutMs||25000);window[cb]=j=>{clearTimeout(t);done();res(j)};s.onerror=()=>{clearTimeout(t);done();rej(new Error('load'))};s.src=API+'?'+qs+'&callback='+cb;document.head.appendChild(s)});
return viaFetch().catch(()=>viaJsonp())}
const HINTS={phone:"Father's or mother's number from the form.",name:'Full name of the student, English or Bangla.',roll:'Your 5-digit Exam Roll.'};
const PH={phone:'01712-345678',name:'e.g. Fatema Tasnim',roll:'e.g. 30028'};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setMode(m){document.querySelectorAll('.seg button').forEach(t=>t.setAttribute('aria-selected',String(t.dataset.mode===m)));$('#hint').textContent=HINTS[m];const q=$('#q');q.placeholder=PH[m];q.inputMode=m==='name'?'text':(m==='roll'?'numeric':'tel');q.focus()}
document.querySelectorAll('.seg button').forEach(t=>t.addEventListener('click',()=>setMode(t.dataset.mode)));
function renderInfo(){const d=META.disclaimer||{},h=META.helpline||{};const paras=(d.paras||[]).map(p=>'<p>'+esc(p)+'</p>').join('');
$('#info').innerHTML=(paras?'<div class="card note"><h3>'+esc(d.title||'Important information')+'</h3>'+paras+'</div>':'')+
'<div class="card help"><span>Wrong information? Contact <b>'+esc(h.display||'')+'</b></span>'+(h.wa?'<a class="wa" href="'+esc(h.wa)+'" target="_blank" rel="noopener">WhatsApp helpline</a>':'')+'</div>'}
function kv(k,v,extra,cls){return '<div class="kv '+(cls||'')+'"><div class="k">'+k+'</div><div class="v">'+v+(extra||'')+'</div></div>'}
function studentCard(s,i,total){const mc=/online/i.test(s.mode)?'#2f6fd6':'#d98f17';
return '<article class="card"><div class="stuh"><span class="tag">'+(total>1?'Student '+(i+1):'Student')+'</span><span class="elig">&#10003; Eligible for the exam</span></div><div class="grid">'+
kv('Name',esc(s.name),s.bn?'<small class="bn">'+esc(s.bn)+'</small>':'')+kv('Class',esc(s.cls))+
kv('Exam Roll','<span>'+esc(s.roll)+'</span><button class="copy" type="button" data-roll="'+esc(s.roll)+'">Copy</button>','','roll')+
kv('Exam Mode','<span class="mode"><span class="dot" style="background:'+mc+'"></span>'+esc(s.mode||'-')+'</span>')+'</div></article>'}
function banner(type,title,text){const icon=type==='ok'?'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6"><path d="M20 6 9 17l-5-5"/></svg>':(type==='warn'?'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9a5b00" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></svg>':'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a3262a" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>');
return '<div class="banner '+type+'"><span class="ico">'+icon+'</span><div><h2>'+esc(title)+'</h2><p>'+esc(text)+'</p></div></div>'}
function render(res){const box=$('#results');
if(!res||!res.ok){box.innerHTML=banner('bad','Please check your search',res&&res.message?res.message:'Something went wrong. Please try again.');return}
const E=res.eligible||[],P=res.pending||[];let html='';
if(E.length){html+=E.length>1?banner('ok',E.length+' students found','Keep each Exam Roll safe.'):banner('ok','Registration confirmed','Payment received. Keep your Exam Roll safe.');html+=E.map((s,i)=>studentCard(s,i,E.length)).join('')}
if(P.length){html+='<div class="card pend">'+banner('warn','Payment not confirmed yet','The Exam Roll is issued after the fee is received. Already paid? Contact the helpline.').replace('class="banner warn"','class="banner warn" style="padding:0;border:0;background:none"')+'<ul>'+P.map(p=>'<li>'+esc(p.name)+(p.bn?' <span class="bn">('+esc(p.bn)+')</span>':'')+'<span>'+esc(p.cls)+'</span></li>').join('')+'</ul></div>'}
if(!E.length&&!P.length){html=banner('bad','No registration found',res.kind==='phone'?"No student with this number. Try the other parent's number, or search by name.":(res.kind==='roll'?'Exam Roll not found. Check your confirmation message.':'No student with this name. Check the spelling, or search by mobile number.'))}
html+='<button class="again" type="button" id="again">Search another student</button>';box.innerHTML=html;
box.querySelectorAll('.copy').forEach(b=>b.addEventListener('click',()=>{(navigator.clipboard?navigator.clipboard.writeText(b.dataset.roll):Promise.reject()).then(()=>{b.textContent='Copied';setTimeout(()=>b.textContent='Copy',1500)}).catch(()=>{})}));
$('#again').addEventListener('click',()=>{$('#q').value='';box.innerHTML='';window.scrollTo({top:0,behavior:'smooth'});$('#q').focus()});
box.scrollIntoView({behavior:'smooth',block:'start'})}
$('#f').addEventListener('submit',e=>{e.preventDefault();const q=$('#q').value.trim();if(!q){$('#q').focus();return}
const btn=$('#go');btn.disabled=true;btn.textContent='Checking...';$('#results').innerHTML='<div class="skel"></div>';
api({api:'search',q:q}).then(r=>{btn.disabled=false;btn.textContent='Check status';render(r)}).catch(()=>{btn.disabled=false;btn.textContent='Check status';render({ok:false,message:'Connection problem. Please check your internet and try again.'})})});
setMode('phone');renderInfo();
api({api:'meta'},20000).then(m=>{if(m&&m.helpline){META=m;renderInfo()}}).catch(()=>{});
</script></body></html>
