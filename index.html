function geoInit(){try{GEO=JSON.parse(sessionStorage.getItem('qec_geo')||'null')}catch(e){GEO=null}if(GEO)return;
const get=(u,f)=>{const c=typeof AbortController!=='undefined'?new AbortController():null;const t=setTimeout(()=>{if(c)c.abort()},4000);return fetch(u,{credentials:'omit',signal:c?c.signal:undefined}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(f).finally(()=>clearTimeout(t))};
const keep=g=>{if(!g||!(g.g||g.ip))throw 0;GEO=g;try{sessionStorage.setItem('qec_geo',JSON.stringify(g))}catch(e){}};
get('https://get.geojs.io/v1/ip/geo.json',j=>keep({g:[j.city,j.region,j.country_code].filter(x=>x).join(', '),ip:j.ip||'',isp:j.organization_name||''}))
.catch(()=>get('https://ipapi.co/json/',j=>keep({g:[j.city,j.region,j.country_code].filter(x=>x).join(', '),ip:j.ip||'',isp:j.org||''}))).catch(()=>{})}
function ci(){return Object.assign({d:devTxt()},GEO||{})}
function meetBtn(u){const ok=/^https:\/\/\S+$/i.test(u||'');const ico='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><rect x="2.5" y="6" width="13" height="12" rx="2.5"/><path d="M15.5 10.5 21 7v10l-5.5-3.5"/></svg>';return ok?'<a class="meet bn" href="'+esc(u)+'" target="_blank" rel="noopener">'+ico+'<span>Exam শুরু করার আগে এই লিঙ্কের মাধ্যমে Google Meet এ যুক্ত হও</span></a>':'<div class="meet off bn">'+ico+'<span>Google Meet লিঙ্ক শীঘ্রই এখানে দেওয়া হবে</span></div>'}

let META={helpline:HELP,disclaimer:{title:'',paras:[]}};
function api(params,timeoutMs){const qs=Object.keys(params).map(k=>k+'='+encodeURIComponent(params[k])).join('&');
const viaFetch=()=>new Promise((res,rej)=>{const ctl=typeof AbortController!=='undefined'?new AbortController():null;const t=setTimeout(()=>{if(ctl)ctl.abort();rej(new Error('timeout'))},timeoutMs||25000);
fetch(API+'?'+qs,{credentials:'omit',redirect:'follow',signal:ctl?ctl.signal:undefined}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(j=>{clearTimeout(t);res(j)},e=>{clearTimeout(t);rej(e)})});
const viaJsonp=()=>new Promise((res,rej)=>{const cb='qec_cb_'+Date.now()+'_'+Math.floor(Math.random()*1e6);const s=document.createElement('script');const done=()=>{try{delete window[cb]}catch(e){window[cb]=undefined}s.remove()};
const t=setTimeout(()=>{done();rej(new Error('timeout'))},timeoutMs||25000);window[cb]=j=>{clearTimeout(t);done();res(j)};s.onerror=()=>{clearTimeout(t);done();rej(new Error('load'))};s.src=API+'?'+qs+'&callback='+cb;document.head.appendChild(s)});
return viaFetch().catch(()=>viaJsonp())}
const HINTS={phone:"Father's or mother's mobile number from the form.",name:'Full name of the student, in English or Bangla.',roll:'The 5-digit Exam Roll.'};
const PH={phone:'01712-345678',name:'e.g. Fatema Tasnim',roll:'e.g. 30028'};
function setMode(m,focus){document.querySelectorAll('.seg button').forEach(t=>t.setAttribute('aria-selected',String(t.dataset.mode===m)));$('#hint').textContent=HINTS[m];const q=$('#q');q.placeholder=PH[m];q.inputMode=m==='name'?'text':(m==='roll'?'numeric':'tel');if(focus)q.focus()}
document.querySelectorAll('.seg button').forEach(t=>t.addEventListener('click',()=>setMode(t.dataset.mode,true)));
function renderInfo(){const d=META.disclaimer||{},h=META.helpline||HELP;const paras=(d.paras||[]).map(p=>'<p>'+esc(p)+'</p>').join('');
$('#info').innerHTML=(paras?'<div class="card note"><h3>'+esc(tc(d.title||'Important Information'))+'</h3>'+paras+'</div>':'')+
'<div class="card help"><span>Wrong information? Call '+nw(h.display||'')+'</span>'+(h.wa?'<a class="wa" href="'+esc(h.wa)+'" target="_blank" rel="noopener">WhatsApp Helpline</a>':'')+'</div>'}
function tc(t){const sm={a:1,an:1,the:1,of:1,to:1,in:1,on:1,at:1,for:1,and:1,or:1,via:1};return String(t||'').split(' ').map((w,i)=>i&&sm[w.toLowerCase()]?w.toLowerCase():w.charAt(0).toUpperCase()+w.slice(1)).join(' ')}
function kv(k,v,extra,cls){return '<div class="kv '+(cls||'')+'"><div class="k">'+k+'</div><div class="v">'+v+(extra||'')+'</div></div>'}
function studentCard(s,i,total){const mc=/online/i.test(s.mode)?'#2f6fd6':'#d98f17';
return '<article class="card stu"><div class="stuh"><span class="tag">'+(total>1?'Student '+(i+1):'Student')+'</span><span class="elig">&#10003; Eligible for the Exam</span></div><div class="grid">'+
kv('Name',esc(s.name),s.bn?'<small class="bn" style="display:block;color:var(--mut);font-weight:600">'+esc(s.bn)+'</small>':'')+kv('Class',nw(s.cls))+
kv('Exam Roll',/\u2022/.test(s.roll||'')?'<span class="nw">'+esc(s.roll)+'</span><small style="display:block;color:var(--mut);font-weight:600;font-size:12px">Full Exam Roll and PIN are in your SMS</small>':'<span class="nw">'+esc(s.roll)+'</span><button class="copy" type="button" data-roll="'+esc(s.roll)+'">Copy</button>')+
kv('Exam Mode','<span class="nw"><span class="dot" style="background:'+mc+';margin-right:7px"></span>'+esc(s.mode||'-')+'</span>')+'</div></article>'}
function banner(type,title,text){const icon=type==='ok'?'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8"><path d="M20 6 9 17l-5-5"/></svg>':(type==='warn'?'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9a5b00" stroke-width="2.4"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></svg>':'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a3262a" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>');
return '<div class="banner '+type+'"><span class="ico">'+icon+'</span><div><h3>'+esc(title)+'</h3><p>'+esc(text)+'</p></div></div>'}
function render(res){const box=$('#results');
if(!res||!res.ok){box.innerHTML=banner('bad','Please Check Your Search',res&&res.message?res.message:'Something went wrong. Please try again.');return}
const E=res.eligible||[],P=res.pending||[];let html='';
if(E.length){html+=E.length>1?banner('ok',E.length+' Students Found','Keep each Exam Roll safe.'):banner('ok','Registration Confirmed','Payment received. Keep your Exam Roll safe.');html+=E.map((s,i)=>studentCard(s,i,E.length)).join('')}
if(P.length){html+='<div class="card pend">'+banner('warn','Payment Not Confirmed Yet','The Exam Roll is given after the fee is received. Already paid? Call the helpline.').replace('class="banner warn"','class="banner warn" style="margin:0;padding:0;background:none"')+'<ul>'+P.map(p=>'<li><span>'+esc(p.name)+(p.bn?' <span class="bn" style="color:var(--mut)">('+esc(p.bn)+')</span>':'')+'</span><span class="c">'+esc(p.cls)+'</span></li>').join('')+'</ul></div>'}
if(!E.length&&!P.length){html=banner('bad','No Registration Found',res.kind==='phone'?"No student with this number. Try the other parent's number, or search by name.":(res.kind==='roll'?'Exam Roll not found. Check your confirmation message.':'No student with this name. Check the spelling, or search by mobile number.'))}
html+='<button class="again" type="button" id="again">Search Another Student</button>';box.innerHTML=html;
box.querySelectorAll('.copy').forEach(b=>b.addEventListener('click',()=>{(navigator.clipboard?navigator.clipboard.writeText(b.dataset.roll):Promise.reject()).then(()=>{b.textContent='Copied';setTimeout(()=>b.textContent='Copy',1500)}).catch(()=>{})}));
$('#again').addEventListener('click',()=>{$('#q').value='';box.innerHTML='';window.scrollTo({top:0,behavior:'smooth'});$('#q').focus()});
box.scrollIntoView({behavior:'smooth',block:'start'})}
$('#f').addEventListener('submit',e=>{e.preventDefault();const q=$('#q').value.trim();if(!q){$('#q').focus();return}
const btn=$('#go');btn.disabled=true;btn.textContent='Checking...';$('#results').innerHTML='<div class="skel"></div>';
api({api:'search',q:q}).then(r=>{btn.disabled=false;btn.textContent='Check Status';render(r)}).catch(()=>{btn.disabled=false;btn.textContent='Check Status';render({ok:false,message:'Connection problem. Please check your internet and try again.'})})});
setMode('phone',false);renderInfo();
api({api:'meta'},20000).then(m=>{if(m&&m.helpline){META=m;renderInfo()}}).catch(()=>{});
</script></body></html>
