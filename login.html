<style>
:root{--plum:#5b1462;--plum2:#7a2484;--plumd:#36093c;--amber:#f3ae3c;--amber2:#ffc864;--ink:#1c1421;--mut:#6c6273;--line:#ece6ef;--bg:#f5f1f7;--card:#fff;

padding:10px 18px;border-radius:999px;border:0;box-shadow:0 0 0 4px rgba(243,174,60,.25),0 10px 22px -8px rgba(243,174,60,.9);transition:transform .15s,box-shadow .15s}

.hero{position:relative;max-width:1060px;margin:0 auto;padding:8px 20px 72px}

.in{width:100%;height:50px;border:1.5px solid var(--line);border-radius:13px;padding:0 15px;font:600 16px "Plus Jakarta Sans",sans-serif;color:var(--ink);background:#fbf9fc;outline:none;transition:border-color .15s,box-shadow .15s}
.in:focus{border-color:var(--plum2);box-shadow:0 0 0 4px rgba(122,36,132,.12);background:#fff}

.btn{height:50px;border:0;border-radius:13px;padding:0 22px;background:linear-gradient(180deg,var(--plum2),var(--plum));color:#fff;font-weight:800;font-size:15.5px;white-space:nowrap;transition:filter .15s,transform .15s}
.btn:hover{filter:brightness(1.08)}.btn:disabled{opacity:.6;cursor:wait}
.btn.amber{background:linear-gradient(180deg,var(--amber2),var(--amber));color:#2d1500;box-shadow:0 10px 22px -10px rgba(243,174,60,.95)}
.btn.wide{width:100%}
.err{margin-top:12px;background:var(--badbg);color:var(--bad);border-radius:12px;padding:10px 13px;font-size:14px;font-weight:600}

.skel{height:110px;border-radius:var(--r);background:linear-gradient(90deg,#eee7f1,#f7f3f9,#eee7f1);background-size:200% 100%;animation:sk 1.2s infinite;margin-top:16px}
@keyframes sk{to{background-position:-200% 0}}
.chip{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:12.5px;font-weight:700;padding:5px 11px;border-radius:999px;background:#f3ecf5;color:var(--plum)}

.kv .v{font-size:15px;font-weight:700;margin-top:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.copy{border:0;background:#efe6f2;color:var(--plum);font-weight:700;font-size:12px;border-radius:8px;padding:4px 10px;margin-left:8px;vertical-align:2px}
.ghost{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:42px;padding:0 15px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-weight:700;font-size:14px;text-decoration:none;white-space:nowrap}
.ghost:hover{border-color:#d9cde0}
.wa{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 16px;border-radius:12px;background:#1f9d55;color:#fff;font-weight:800;font-size:14px;text-decoration:none;white-space:nowrap}
.banner{display:flex;gap:12px;align-items:flex-start;border-radius:var(--r);padding:15px 16px;margin-top:16px}
.banner .ico{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.banner h3{font-size:16px;font-weight:800;text-wrap:balance}.banner p{font-size:14px;margin-top:2px;color:inherit;opacity:.9}
.banner.ok{background:var(--okbg);color:#0b5535}.banner.ok .ico{background:var(--ok)}
.banner.warn{background:var(--warnbg);color:#6b4100}.banner.warn .ico{background:#ffe2a8}
.banner.bad{background:var(--badbg);color:#7d1c1f}.banner.bad .ico{background:#fbd3d3}
/* exam block on the dashboard */
.exc{position:relative;overflow:hidden;border-radius:var(--r);padding:20px;color:#fff;background:linear-gradient(135deg,#3b0a41,var(--plum) 55%,#8b2c86);box-shadow:var(--sh)}
.exc:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(243,174,60,.45),transparent 70%)}
.exc>*{position:relative;z-index:1}
.exc .eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--amber2)}
.exc h2{color:#fff;font-size:clamp(19px,2.6vw,23px);margin-top:6px}
.exc .when{margin-top:4px;font-size:14.5px;color:rgba(255,255,255,.88);font-weight:600}
.cd{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:16px 0 4px;max-width:420px}
.cd div{background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:10px 4px;text-align:center}
.cd b{display:block;font-size:clamp(22px,4.4vw,30px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.cd span{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.go{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;margin-top:16px;border:0;border-radius:15px;text-decoration:none;
font-weight:800;font-size:17px;color:#2d1500;background:linear-gradient(180deg,#ffd27a,var(--amber));box-shadow:0 0 0 0 rgba(243,174,60,.7),0 14px 28px -12px rgba(0,0,0,.55);padding:10px 16px;text-align:center}
.go.pulse{animation:pl 1.6s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(255,200,100,.75),0 14px 28px -12px rgba(0,0,0,.55)}70%{box-shadow:0 0 0 14px rgba(255,200,100,0),0 14px 28px -12px rgba(0,0,0,.55)}100%{box-shadow:0 0 0 0 rgba(255,200,100,0),0 14px 28px -12px rgba(0,0,0,.55)}}
.go.off{background:rgba(255,255,255,.14);color:rgba(255,255,255,.85);box-shadow:none;cursor:default;font-size:15px}
.exnote{margin-top:12px;font-size:13px;color:rgba(255,255,255,.82);line-height:1.55}
.demo{display:flex;gap:10px;align-items:center;background:#fff4dc;color:#6b4100;border:1px dashed #e7b250;border-radius:14px;padding:10px 13px;font-size:13.5px;font-weight:600;margin-bottom:14px}
.demo b{font-weight:800}
.done{background:linear-gradient(135deg,#0c5d39,#11804f)}
.done:after{background:radial-gradient(circle,rgba(255,255,255,.18),transparent 70%)}
.closed{background:linear-gradient(135deg,#3b3540,#57505d)}
@media(min-width:900px){.bar,.hero,main{padding-left:28px;padding-right:28px}}
@media(max-width:599px){.bar{padding:12px 16px}.hero{padding:6px 16px 66px}main{padding:0 16px 24px}.logo img{height:28px}.cta{padding:9px 14px;font-size:13px}.ghostl{padding:8px 12px;font-size:12.5px}
.lead{display:none}.pad{padding:17px}.grid{grid-template-columns:1fr}.exc{padding:17px}.cd{gap:6px}}
@media print{body *{visibility:hidden}}

.prof{display:flex;gap:15px;align-items:center;padding:18px 20px}
.ph{flex:0 0 72px;width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,var(--plum2),var(--plum));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:24px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.prof h2{font-size:clamp(17px,2.3vw,20px);line-height:1.25}
.bnn{color:var(--mut);font-size:14px;margin-top:1px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.secth{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);padding:16px 20px 8px}
.dash{display:grid;gap:16px}
.acts{display:flex;flex-wrap:wrap;gap:8px;padding:4px 20px 18px}
.upd{color:var(--mut);font-size:12px;padding:0 20px 16px}
.roll .v{font-size:22px;letter-spacing:.04em}
@media(min-width:900px){.g1{grid-template-columns:1fr!important}}
@media(min-width:900px){.dash{grid-template-columns:7fr 5fr;align-items:start}.dash .exc{grid-column:1/-1}.prof{padding:20px 22px}.ph{flex-basis:84px;width:84px;height:84px;font-size:28px}}
</style></head><body><header class="top"><div class="bar"><a class="logo" href="./" aria-label="QEC Academy home"><img alt="QEC Academy" src="assets/logo.png?v=5"></a><a class="ghostl" href="./">Check registration</a></div>
<div class="hero"><h1>QEC Medha Onneshon <i>2026</i></h1><p class="sub bn">QEC মেধা অন্বেষণ ২০২৬</p><p class="lead">Log in with your Exam Roll and PIN to see your exam and updates.</p></div></header><main>
<section class="card pad narrow" id="loginCard"><h2 style="margin-bottom:4px">Student login</h2><p style="color:var(--mut);font-size:14px;margin-bottom:16px">Your dashboard and exam link.</p>
<form id="f" autocomplete="off" novalidate><div style="display:grid;gap:13px">
<div><label class="lbl" for="roll">Exam Roll</label><input class="in" id="roll" type="text" inputmode="text" autocapitalize="characters" maxlength="10" placeholder="e.g. 10001" autocomplete="off" spellcheck="false"></div>
<div><label class="lbl" for="pin">6-digit PIN</label><div class="pinw"><input class="in" id="pin" type="password" inputmode="numeric" maxlength="6" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;" autocomplete="off"><button type="button" id="eye" aria-label="Show PIN">Show</button></div></div>
<button class="btn amber wide" id="go" type="submit" style="height:54px;font-size:16.5px">Log in</button></div>
<div class="err" id="err" role="alert" hidden></div></form>
<p class="hint">Roll and PIN are in your SMS.<br>Need help? <a id="hl" href="tel:01841233235">01841-233235</a></p></section>
<section id="dash" hidden></section></main>
<footer>&copy; 2026 QEC Academy</footer>
<script>
const API='https://script.google.com/macros/s/AKfycbzS5Ol6KGT4sCpsgNoNHBDFivjj_fHI6BFPpDjihnx5X4XX_C_bYCKcamYkToVFmPrv-Q/exec';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bn2en=s=>String(s||'').replace(/[০-৯]/g,d=>String(d.charCodeAt(0)-0x09E6));
const TZ='Asia/Dhaka';
function fmtT(ms){try{return new Date(ms).toLocaleTimeString('en-US',{timeZone:TZ,hour:'numeric',minute:'2-digit'})}catch(e){return ''}}
function fmtD(ms){try{return new Date(ms).toLocaleDateString('en-GB',{timeZone:TZ,weekday:'short',day:'numeric',month:'short',year:'numeric'})}catch(e){return ''}}
function nw(s){return '<span class="nw">'+esc(s)+'</span>'}
function post(body,ms){const ctl=typeof AbortController!=='undefined'?new AbortController():null;const t=setTimeout(()=>{if(ctl)ctl.abort()},ms||30000);
return fetch(API,{method:'POST',credentials:'omit',redirect:'follow',signal:ctl?ctl.signal:undefined,headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)})
.then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).finally(()=>clearTimeout(t))}
function ss(k,v){try{if(v===undefined)return JSON.parse(sessionStorage.getItem(k)||'null');if(v===null)sessionStorage.removeItem(k);else sessionStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function normRoll(v){const s=bn2en(v).toUpperCase().replace(/\s+/g,'');if(/^D-?\d{3,8}$/.test(s))return s.indexOf('-')<0?'D-'+s.slice(1):s;return s.replace(/\D/g,'')}
const HELP={local:'01841233235',display:'01841-233235',wa:'https://wa.me/8801841233235'};

let creds=null,data=null,poll=null,tick=null,busy=false,skew=0;
const nowS=()=>Date.now()+skew;
function showErr(m){const e=$('#err');e.textContent=m;e.hidden=!m}
async function doLogin(roll,pin,silent){if(busy)return;busy=true;const btn=$('#go');if(!silent){btn.disabled=true;btn.textContent='Checking...';showErr('')}
try{const t0=Date.now();const j=await post({a:'login',roll:roll,pin:pin});
if(j&&j.ok){creds={roll:roll,pin:pin};ss('qec_auth',creds);if(j.ex&&j.ex.now)skew=j.ex.now-Math.round((t0+Date.now())/2);data=j;render();startPoll()}
else if(!silent){showErr((j&&j.message)||'Login failed. Please try again.')}else if(j&&j.ok===false&&!j.locked){logout()}}
catch(e){if(!silent)showErr('Could not reach the server. Check your internet and try again.')}
finally{busy=false;btn.disabled=false;btn.textContent='Log in'}}
function startPoll(){clearInterval(poll);poll=setInterval(()=>{if(creds&&!document.hidden)doLogin(creds.roll,creds.pin,true)},180000)}
function logout(){creds=null;data=null;ss('qec_auth',null);clearInterval(poll);clearInterval(tick);$('#dash').hidden=true;$('#dash').innerHTML='';$('#loginCard').hidden=false;$('#pin').value='';showErr('');window.scrollTo(0,0)}
function initials(n){const p=String(n||'').trim().split(/\s+/).filter(Boolean);return((p[0]||'?')[0]+(p.length>1?p[p.length-1][0]:'')).toUpperCase()}
function kv(k,v,cls){return '<div class="kv '+(cls||'')+'"><div class="k">'+esc(k)+'</div><div class="v">'+v+'</div></div>'}
const safeUrl=u=>/^https?:\/\//i.test(String(u||''))?String(u):'';
function pad2(n){return String(n).padStart(2,'0')}
function cdHtml(ms){const s=Math.max(0,Math.floor(ms/1000));const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),x=s%60;
return '<div><b>'+d+'</b><span>Days</span></div><div><b>'+pad2(h)+'</b><span>Hours</span></div><div><b>'+pad2(m)+'</b><span>Min</span></div><div><b>'+pad2(x)+'</b><span>Sec</span></div>'}
function examWhen(ex){return nw(fmtD(ex.opens))+' &middot; '+nw(fmtT(ex.opens)+' – '+fmtT(ex.closes))}
function exState(ex){const n=nowS();if(ex.demo)return 'demo';if(!ex.set)return 'none';if(!ex.online)return 'offline';if(ex.status==='submitted')return 'submitted';
if(!ex.enabled)return 'none';if(n<ex.opens)return 'before';if(n>=ex.closes)return 'closed';return ex.status==='progress'?'progress':'open'}
function examCard(){const j=data,ex=j.ex,s=j.student;if(!ex)return '';const st=exState(ex);const pl=(j.exam||{}).place||{};
const ICO='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg>';
let h='';
if(st==='demo'){h='<div class="demo"><span>&#9733;</span><span><b>Demo account.</b> Practice exam of '+esc(ex.demoMin)+' minutes, open at any time. Nothing is recorded for any student.</span></div>'+
'<span class="eyebrow">'+ICO+'Practice exam</span><h2>Online exam (demo)</h2><p class="when">Real exam: '+examWhen(ex)+'</p>'+
'<div class="cd" id="cd">'+cdHtml(ex.opens-nowS())+'</div><a class="go pulse" href="exam.html">Click here to enter the exam &rarr;</a>'+
'<p class="exnote">On exam day this button appears at '+nw(fmtT(ex.opens))+' sharp. Every exam ends at '+nw(fmtT(ex.closes))+'.</p>';return '<section class="exc">'+h+'</section>'}
if(st==='offline'){return '<section class="exc"><span class="eyebrow">'+ICO+'Offline exam</span><h2>Exam at the centre</h2><p class="when">'+esc((j.exam||{}).date||'')+(j.exam&&j.exam.time?' &middot; '+nw(j.exam.time):'')+'</p>'+
'<p class="exnote">Venue: <b>'+esc(pl.type==='venue'?pl.value:'QEC Academy (Chottogram)')+'</b>. Pen and paper exam. Please arrive early.</p></section>'}
if(st==='submitted'){return '<section class="exc done"><span class="eyebrow" style="color:#bff0d6">&#10003; Exam submitted</span><h2>Thank you, '+esc((s.name||'').split(' ')[0]||'student')+'!</h2>'+
'<p class="when">Your answers were submitted'+(ex.at?' at '+nw(fmtT(ex.at)):'')+'.</p><p class="exnote">Results will be announced here on your dashboard.</p></section>'}
if(st==='closed'){return '<section class="exc closed"><span class="eyebrow" style="color:#e3dbe8">'+ICO+'Exam ended</span><h2>The online exam has ended</h2><p class="when">'+examWhen(ex)+'</p><p class="exnote">Results will be announced here on your dashboard.</p></section>'}
if(st==='none'){return '<section class="exc"><span class="eyebrow">'+ICO+'Online exam</span><h2>Exam details coming soon</h2><p class="exnote">The exam link will appear here.</p></section>'}
h='<span class="eyebrow">'+ICO+'Online exam</span><h2>'+(st==='before'?'Your exam starts in':(st==='progress'?'Your exam is running':'The exam is open now'))+'</h2><p class="when">'+examWhen(ex)+'</p>';
if(st==='before')h+='<div class="cd" id="cd">'+cdHtml(ex.opens-nowS())+'</div><div class="go off">The exam button opens at '+nw(fmtT(ex.opens))+'</div>';
else h+='<a class="go pulse" href="exam.html">'+(st==='progress'?'Continue my exam &rarr;':'Click here to enter the exam &rarr;')+'</a><p class="exnote" id="left"></p>';
h+='<p class="exnote">Strict time: the exam ends at '+nw(fmtT(ex.closes))+' for everyone. Joining late means less time. Log in a few minutes early.</p>';
return '<section class="exc">'+h+'</section>'}
function render(){const j=data,s=j.student||{},ex=j.exam||{},pl=ex.place||{};const online=/online/i.test(s.mode||'');
const photo=/^data:image\/(png|jpeg|jpg|gif|webp);base64,/.test(s.photo||'')?'<img alt="" src="'+s.photo+'">':esc(initials(s.name));
const g=safeUrl(j.group),hl=j.helpline||HELP;
let place='';
if(online)place=kv('Mode','<span class="nw"><span class="dot" style="background:#2f6fd6;margin-right:7px"></span>Online exam</span>');
else place=kv('Venue',esc(pl.type==='venue'?pl.value:'To be announced'));
const xe=j.ex;const date=xe&&xe.set&&online?nw(fmtD(xe.opens)):esc(ex.date||'To be announced');const time=xe&&xe.set&&online?nw(fmtT(xe.opens))+' – '+nw(fmtT(xe.closes)):(ex.time?nw(ex.time):'To be announced');
$('#dash').innerHTML='<div class="dash">'+examCard()+
'<div class="card"><div class="prof"><div class="ph">'+photo+'</div><div style="min-width:0"><h2>'+esc(s.name)+'</h2>'+(s.bn?'<p class="bnn bn">'+esc(s.bn)+'</p>':'')+
'<div class="chips"><span class="chip">'+esc(s.clsv||s.cls||'')+'</span><span class="chip"><span class="dot" style="background:'+(online?'#2f6fd6':'#d98f17')+'"></span>'+esc(s.mode||'-')+'</span>'+(j.demo?'<span class="chip" style="background:#fff1d6;color:#7a4b00">Demo</span>':'<span class="chip" style="background:#e7f6ee;color:#0f7a49">&#10003; Enrolled</span>')+'</div></div></div>'+
'<div style="padding:0 20px 20px"><div class="kv roll"><div class="k">Exam Roll</div><div class="v"><span class="nw">'+esc(s.roll)+'</span><button class="copy" id="cp" type="button">Copy</button></div></div></div></div>'+
'<div class="card"><div class="secth">Exam details</div><div class="grid g1" style="padding:0 20px 14px">'+kv('Date',date)+kv('Time',time)+'<div style="grid-column:1/-1;display:grid">'+place+'</div></div>'+
(ex.note?'<p class="upd">'+esc(ex.note)+'</p>':'')+
'<div class="acts">'+(g?'<a class="wa" href="'+esc(g)+'" target="_blank" rel="noopener">Join WhatsApp group</a>':'')+
'<a class="ghost" href="tel:'+esc(hl.local)+'">Helpline '+nw(hl.display||hl.local)+'</a>'+
'<button class="ghost" id="rf" type="button">Refresh</button><button class="ghost" id="lo" type="button">Log out</button></div>'+
'<div class="upd">'+(g?'':'WhatsApp group link: coming soon. &middot; ')+'Updated '+nw(j.updated||'')+'</div></div></div>';
$('#loginCard').hidden=true;$('#dash').hidden=false;
$('#lo').onclick=logout;$('#rf').onclick=()=>{if(creds)doLogin(creds.roll,creds.pin,true)};
$('#cp').onclick=()=>{try{navigator.clipboard.writeText(s.roll);$('#cp').textContent='Copied';setTimeout(()=>{const c=$('#cp');if(c)c.textContent='Copy'},1500)}catch(e){}};
clearInterval(tick);let last=data.ex?exState(data.ex):'';
tick=setInterval(()=>{if(!data||!data.ex)return;const ex=data.ex,st=exState(ex);if(st!==last){last=st;render();return}
const c=$('#cd');if(c)c.innerHTML=cdHtml(ex.opens-nowS());const l=$('#left');if(l){const ms=ex.closes-nowS();const m=Math.max(0,Math.floor(ms/60000)),x=Math.max(0,Math.floor(ms/1000)%60);l.innerHTML='Time left: <b class="nw">'+m+' min '+pad2(x)+' sec</b>'}},1000)}
$('#eye').onclick=()=>{const p=$('#pin'),h=p.type==='password';p.type=h?'text':'password';$('#eye').textContent=h?'Hide':'Show'};
$('#f').addEventListener('submit',ev=>{ev.preventDefault();const roll=normRoll($('#roll').value),pin=bn2en($('#pin').value).replace(/\D/g,'');
if(!/^(\d{3,8}|D-\d{3,8})$/.test(roll)){showErr('Enter your Exam Roll (from your SMS).');return}
if(!/^\d{6}$/.test(pin)){showErr('The PIN has 6 digits. Check your SMS.');return}
doLogin(roll,pin,false)});
const saved=ss('qec_auth');if(saved&&saved.roll&&saved.pin){$('#loginCard').hidden=true;$('#dash').hidden=false;$('#dash').innerHTML='<div class="skel"></div>';busy=false;
post({a:'login',roll:saved.roll,pin:saved.pin}).then(j=>{if(j&&j.ok){creds=saved;data=j;if(j.ex&&j.ex.now)skew=j.ex.now-Date.now();render();startPoll()}else logout()}).catch(()=>{logout();showErr('Could not reach the server. Please log in again.')})}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&creds)doLogin(creds.roll,creds.pin,true)});
</script></body></html>
