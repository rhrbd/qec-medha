padding:10px 18px;border-radius:999px;border:0;box-shadow:0 0 0 4px rgba(243,174,60,.25),0 10px 22px -8px rgba(243,174,60,.9);transition:transform .15s,box-shadow .15s}

(q.k==='*'?'<p class="all">This question gives the mark to everyone.</p>':'')+'</div>'};
w.innerHTML='<div class="svh"><div class="t"><b>My Answer Script</b><span>'+esc(j.name)+' · Roll '+esc(j.roll)+' · Class '+esc(j.cls)+' ('+esc(j.ver)+')</span></div><button type="button" id="svc">Close</button></div>'+
'<div class="svsum"><div><b>'+got+'/'+of+'</b><span>Correct</span></div><div><b>'+wr+'</b><span>Wrong</span></div><div><b>'+sk+'</b><span>Not answered</span></div></div>'+
'<div class="svs">'+tabs.map(t=>'<button type="button" data-f="'+t[0]+'" class="'+(t[0]===f?'on':'')+'">'+esc(t[1])+'</button>').join('')+'</div>'+
