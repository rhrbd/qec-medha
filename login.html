<script>

const get=(u,f)=>{const c=typeof AbortController!=='undefined'?new AbortController():null;const t=setTimeout(()=>{if(c)c.abort()},4000);return fetch(u,{credentials:'omit',signal:c?c.signal:undefined}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(f).finally(()=>clearTimeout(t))};
const keep=g=>{if(!g||!(g.g||g.ip))throw 0;GEO=g;try{sessionStorage.setItem('qec_geo',JSON.stringify(g))}catch(e){}};
get('https://get.geojs.io/v1/ip/geo.json',j=>keep({g:[j.city,j.region,j.country_code].filter(x=>x).join(', '),ip:j.ip||'',isp:j.organization_name||''}))
.catch(()=>get('https://ipapi.co/json/',j=>keep({g:[j.city,j.region,j.country_code].filter(x=>x).join(', '),ip:j.ip||'',isp:j.org||''}))).catch(()=>{})}
function ci(){return Object.assign({d:devTxt()},GEO||{})}
function meetBtn(u){const ok=/^https:\/\/\S+$/i.test(u||'');const ico='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><rect x="2.5" y="6" width="13" height="12" rx="2.5"/><path d="M15.5 10.5 21 7v10l-5.5-3.5"/></svg>';return ok?'<a class="meet bn" href="'+esc(u)+'" target="_blank" rel="noopener">'+ico+'<span>Exam শুরু করার আগে এই লিঙ্কের মাধ্যমে Google Meet এ যুক্ত হও</span></a>':'<div class="meet off bn">'+ico+'<span>Google Meet লিঙ্ক শীঘ্রই এখানে দেওয়া হবে</span></div>'}

let creds=null,data=null,poll=null,tick=null,busy=false,skew=0;
geoInit();
const nowS=()=>Date.now()+skew;
function showErr(m){const e=$('#err');e.textContent=m;e.hidden=!m}
async function doLogin(roll,pin,silent){if(busy)return;busy=true;const btn=$('#go');if(!silent){btn.disabled=true;btn.textContent='Checking...';showErr('')}
try{let t0=Date.now(),j=null;for(let k=0;k<3;k++){try{t0=Date.now();j=await post({a:'login',roll:roll,pin:pin,ci:ci(),bg:silent?1:undefined},25000);break}catch(x){if(k===2)throw x;await new Promise(r=>setTimeout(r,1200+Math.random()*1800*(k+1)))}}
if(j&&j.ok){creds={roll:roll,pin:pin};ss('qec_auth',creds);if(j.ex&&j.ex.now)skew=j.ex.now-Math.round((t0+Date.now())/2);data=j;render();startPoll()}
else if(!silent){showErr((j&&j.message)||'Login failed. Please try again.')}else if(j&&j.ok===false&&!j.locked&&/not correct|not active/i.test(j.message||'')){logout()}}
catch(e){if(!silent)showErr('Could not reach the server. Check your internet and try again.')}
finally{busy=false;btn.disabled=false;btn.textContent='Log In'}}
function startPoll(){clearInterval(poll);poll=setInterval(()=>{if(creds&&!document.hidden)doLogin(creds.roll,creds.pin,true)},180000)}
function logout(){creds=null;data=null;ss('qec_auth',null);clearInterval(poll);clearInterval(tick);$('#dash').hidden=true;$('#dash').innerHTML='';$('#loginCard').hidden=false;$('#pin').value='';showErr('');window.scrollTo(0,0)}
function initials(n){const p=String(n||'').trim().split(/\s+/).filter(Boolean);return((p[0]||'?')[0]+(p.length>1?p[p.length-1][0]:'')).toUpperCase()}
function kv(k,v,cls){return '<div class="kv '+(cls||'')+'"><div class="k">'+esc(k)+'</div><div class="v">'+v+'</div></div>'}
const safeUrl=u=>/^https?:\/\//i.test(String(u||''))?String(u):'';
function pad2(n){return String(n).padStart(2,'0')}
function cdHtml(ms){const s=Math.max(0,Math.floor(ms/1000));const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),x=s%60;
return '<div><b>'+d+'</b><span>Days</span></div><div><b>'+pad2(h)+'</b><span>Hours</span></div><div><b>'+pad2(m)+'</b><span>Min</span></div><div><b>'+pad2(x)+'</b><span>Sec</span></div>'}
function examWhen(ex){return nw(fmtD(ex.opens))+' &middot; '+nw(fmtT(ex.opens)+' – '+fmtT(cShown(ex)))}
function exState(ex){const n=nowS();if(ex.review)return 'review';if(ex.demo)return 'demo';if(!ex.set)return 'none';if(!ex.online)return 'offline';if(ex.status==='submitted')return 'submitted';
if(!ex.enabled)return 'none';if(n<ex.opens)return 'before';if(n>=ex.closes)return 'closed';return ex.status==='progress'?'progress':'open'}
function examCard(){const j=data,ex=j.ex,s=j.student;if(!ex)return '';const st=exState(ex);const pl=(j.exam||{}).place||{};
const ICO='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg>';
let h='';
if(st==='demo'){h='<div class="demo"><span>&#9733;</span><span><b>Demo account.</b> Practice exam of '+esc(ex.demoMin)+' minutes, open at any time. Nothing is recorded for any student.</span></div>'+
'<span class="eyebrow">'+ICO+'Practice Exam</span><h2>Online Exam (Demo)</h2><p class="when">Real Exam: '+examWhen(ex)+'</p>'+
'<div class="cd" id="cd">'+cdHtml(ex.opens-nowS())+'</div>'+meetBtn(ex.meet)+'<a class="go pulse" href="exam.html">Start Exam <span class="bn">(এক্সাম শুরু কর)</span> &rarr;</a>'+
'<p class="exnote">On exam day this button appears at '+nw(fmtT(ex.opens))+' sharp. Every exam ends at '+nw(fmtT(cShown(ex)))+'.</p>';return '<section class="exc">'+h+'</section>'}
if(st==='review'){return '<section class="exc"><div class="demo"><span>&#9733;</span><span><b>Final Review account.</b> Opens the REAL question paper of any class exactly as a student sees it. Unlimited attempts. Nothing is recorded for any student. Never share this login.</span></div>'+
'<span class="eyebrow">'+ICO+'Final Review</span><h2>Check the Real Papers</h2><p class="when">Real Exam: '+examWhen(ex)+' &middot; '+esc(ex.minutes)+' minutes</p>'+
meetBtn(ex.meet)+'<a class="go pulse" href="exam.html">Open Final Review &rarr;</a><p class="exnote">Pick the class and version on the next page. Each attempt runs the full exam time.</p></section>'}
if(st==='offline'){const oe=j.exam||{};return '<section class="exc"><span class="eyebrow">'+ICO+'Offline Exam</span><h2>Exam at the Centre</h2><p class="when">'+esc(oe.date||'')+(oe.time?' &middot; '+nw(esc(oe.time)):'')+'</p>'+
(oe.report?'<p class="exnote" style="margin-top:8px">Reporting Time: <b class="nw" style="color:#fff">'+esc(oe.report)+'</b></p>':'')+
'<p class="exnote ctr" style="margin-top:8px">Centre: '+esc(pl.type==='venue'?pl.value:'QEC Academy (Chottogram)')+'</p><p class="exnote" style="margin-top:8px">Pen and paper exam. Bring your Exam Roll.</p></section>'}
if(st==='submitted'){return '<section class="exc done"><span class="eyebrow" style="color:#bff0d6">&#10003; Exam Taken</span><h2>Your Exam Has Been Submitted</h2>'+
'<p class="when">Your answers were submitted'+(ex.at?' at '+nw(fmtT(ex.at)):'')+'.</p><p class="exnote">'+(j.result?'Your result is shown above.':'Results will be announced here on your dashboard.')+'</p></section>'}
if(st==='closed'){return '<section class="exc closed"><span class="eyebrow" style="color:#e3dbe8">'+ICO+'Exam Ended</span><h2>You Have Not Taken the Exam</h2><p class="when">The online exam ('+examWhen(ex)+') has ended. No answers were submitted with this Exam Roll.</p><p class="exnote">Questions? Call the helpline.</p></section>'}
if(st==='none'){return '<section class="exc"><span class="eyebrow">'+ICO+'Online Exam</span><h2>Exam Details Coming Soon</h2><p class="exnote">The exam link will appear here.</p></section>'}
h='<span class="eyebrow">'+ICO+'Online Exam</span><h2>'+(st==='before'?'Your Exam Starts In':(st==='progress'?'Your Exam Is Running':'The Exam Is Open Now'))+'</h2><p class="when">'+examWhen(ex)+'</p>';
if(st==='before')h+='<div class="cd" id="cd">'+cdHtml(ex.opens-nowS())+'</div>'+meetBtn(ex.meet)+'<div class="go off">The Exam Button Opens at '+nw(fmtT(ex.opens))+'</div>';
else h+=meetBtn(ex.meet)+'<a class="go pulse" href="exam.html">'+(st==='progress'?'Continue My Exam &rarr;':'Start Exam <span class="bn">(এক্সাম শুরু কর)</span> &rarr;')+'</a><p class="exnote" id="left"></p>';
h+='<p class="exnote">Strict time: the exam ends at '+nw(fmtT(cShown(ex)))+' for everyone. Joining late means less time. Log in a few minutes early.</p>';
return '<section class="exc">'+h+'</section>'}
function ordn(n){const v=n%100;return n+(v>=11&&v<=13?'th':({1:'st',2:'nd',3:'rd'}[n%10]||'th'))}
function resultCard(){const r=data&&data.result;if(!r)return '';
const pub=r.at?'<p class="rnote">Published '+nw(fmtD(r.at))+'</p>':'';
if(!r.ready)return '<section class="card rcard"><div class="secth">Exam Result</div><div class="rbody"><p class="rmsg">Your result is not ready yet. Please check again later or call the helpline.</p>'+pub+'</div></section>';
if(r.absent)return '<section class="card rcard"><div class="secth">Exam Result</div><div class="rbody"><div class="rbadge abs">Absent</div><p class="rmsg">No exam was recorded for this Exam Roll.</p>'+pub+'</div></section>';
const f=r.full||{b:25,e:25,m:25},row=(k,v,t)=>'<tr><td>'+k+'</td><td><b>'+esc(v)+'</b> / '+esc(t)+'</td></tr>';
return '<section class="card rcard"><div class="secth">Exam Result</div><div class="rbody"><div class="rtop"><div class="rbadge '+(r.pass?'pass':'fail')+'">'+(r.pass?'Passed':'Not Passed')+'</div>'+
(r.merit?'<div class="rmerit"><b>'+esc(ordn(r.merit))+'</b><span>Merit Position · Class '+esc(r.cls)+'</span></div>':'')+'</div>'+
'<table class="rtab">'+row('Bangla',r.b,f.b)+row('English',r.e,f.e)+row('Math',r.m,f.m)+'<tr class="tot"><td>Total</td><td><b>'+esc(r.total)+'</b> / '+esc(r.tfull||(f.b+f.e+f.m))+' &nbsp;('+esc(r.pct)+'%)</td></tr></table>'+pub+'</div></section>'}
function render(){const j=data,s=j.student||{},ex=j.exam||{},pl=ex.place||{};const online=/online/i.test(s.mode||'');
const photo=/^data:image\/(png|jpeg|jpg|gif|webp);base64,/.test(s.photo||'')?'<img alt="" src="'+s.photo+'">':esc(initials(s.name));
const g=safeUrl(j.group),hl=j.helpline||HELP;
let place='';
if(online)place=kv('Mode','<span class="nw"><span class="dot" style="background:#2f6fd6;margin-right:7px"></span>Online Exam</span>');
else place=(ex.report?kv('Reporting Time','<span class="nw">'+esc(ex.report)+'</span>'):'')+'<div class="kv"><div class="k">Exam Centre</div><div class="v ctr">'+esc(pl.type==='venue'?pl.value:'To be announced')+'</div></div>';
const xe=j.ex;const date=xe&&xe.set&&online?nw(fmtD(xe.opens)):esc(ex.date||'To be announced');const time=xe&&xe.set&&online?nw(fmtT(xe.opens))+' – '+nw(fmtT(cShown(xe))):(ex.time?nw(ex.time):'To be announced');
const tips=online?['Charge your phone, tablet or laptop fully.','Use a stable internet connection (Wi-Fi or mobile data).','Log in by <span class="nw">9:50 AM</span> and join the Google Meet before you start.','Keep pen and paper ready for rough work.']:['Reach the exam centre by your Reporting Time.','Bring pen, pencil, eraser and your Exam Roll.','Keep the helpline number with you.'];
$('#dash').innerHTML='<div class="dash">'+resultCard()+examCard()+'<div class="col">'+
'<div class="card"><div class="prof"><div class="ph">'+photo+'</div><div style="min-width:0"><h2>'+esc(s.name)+'</h2>'+(s.bn?'<p class="bnn bn">'+esc(s.bn)+'</p>':'')+
'<div class="chips"><span class="chip">'+esc(s.clsv||s.cls||'')+'</span><span class="chip"><span class="dot" style="background:'+(online?'#2f6fd6':'#d98f17')+'"></span>'+esc(s.mode||'-')+'</span>'+(j.review?'<span class="chip" style="background:#fff1d6;color:#7a4b00">Final Review</span>':j.demo?'<span class="chip" style="background:#fff1d6;color:#7a4b00">Demo</span>':'<span class="chip" style="background:#e7f6ee;color:#0f7a49">&#10003; Enrolled</span>')+'</div></div></div>'+
'<div style="padding:0 20px 20px"><div class="kv roll"><div class="k">Exam Roll</div><div class="v"><span class="nw">'+esc(s.roll)+'</span><button class="copy" id="cp" type="button">Copy</button></div></div></div></div>'+
'<div class="card"><div class="secth">Before the Exam</div><ul class="tips">'+tips.map(t=>'<li><span>'+t+'</span></li>').join('')+'</ul></div></div>'+
'<div class="card"><div class="secth">Exam Details</div><div class="grid g1" style="padding:0 20px 14px">'+kv('Date',date)+kv(online?'Time':'Exam Time',time)+'<div style="grid-column:1/-1;display:grid">'+place+'</div></div>'+
(ex.note?'<p class="upd">'+esc(ex.note)+'</p>':'')+
'<div class="acts">'+(g?'<a class="wa full" href="'+esc(g)+'" target="_blank" rel="noopener">Join WhatsApp Group</a>':'')+
'<a class="ghost full" href="tel:'+esc(hl.local)+'">Helpline '+nw(hl.display||hl.local)+'</a>'+
'<button class="ghost" id="rf" type="button">Refresh</button><button class="ghost" id="lo" type="button">Log Out</button></div>'+
'<div class="upd">'+(g?'':'<span class="nw">WhatsApp group link: coming soon.</span><br>')+'<span class="nw">Updated '+esc(j.updated||'')+'</span></div></div></div>';
$('#loginCard').hidden=true;$('#dash').hidden=false;
$('#lo').onclick=logout;$('#rf').onclick=()=>{if(creds)doLogin(creds.roll,creds.pin,true)};
$('#cp').onclick=()=>{try{navigator.clipboard.writeText(s.roll);$('#cp').textContent='Copied';setTimeout(()=>{const c=$('#cp');if(c)c.textContent='Copy'},1500)}catch(e){}};
clearInterval(tick);let last=data.ex?exState(data.ex):'';
tick=setInterval(()=>{if(!data||!data.ex)return;const ex=data.ex,st=exState(ex);if(st!==last){last=st;render();return}
const c=$('#cd');if(c)c.innerHTML=cdHtml(ex.opens-nowS());const l=$('#left');if(l){const ms=ex.closes-nowS();const m=Math.max(0,Math.floor(ms/60000)),x=Math.max(0,Math.floor(ms/1000)%60);l.innerHTML='Time left: <b class="nw">'+m+' min '+pad2(x)+' sec</b>'}},1000)}
$('#eye').onclick=()=>{const p=$('#pin'),h=p.type==='password';p.type=h?'text':'password';$('#eye').textContent=h?'Hide':'Show'};
$('#f').addEventListener('submit',ev=>{ev.preventDefault();const roll=normRoll($('#roll').value),pin=bn2en($('#pin').value).replace(/\D/g,'');
if(!/^(\d{3,8}|[DR]-\d{3,8})$/.test(roll)){showErr('Enter your Exam Roll (from your SMS).');return}
if(!/^\d{6}$/.test(pin)){showErr('The PIN has 6 digits. Check your SMS.');return}
doLogin(roll,pin,false)});
const saved=ss('qec_auth');if(saved&&saved.roll&&saved.pin){$('#loginCard').hidden=true;$('#dash').hidden=false;$('#dash').innerHTML='<div class="skel"></div>';busy=false;
post({a:'login',roll:saved.roll,pin:saved.pin,ci:ci(),auto:1}).then(j=>{if(j&&j.ok){creds=saved;data=j;if(j.ex&&j.ex.now)skew=j.ex.now-Date.now();render();startPoll()}else logout()}).catch(()=>{logout();showErr('Could not reach the server. Please log in again.')})}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&creds)doLogin(creds.roll,creds.pin,true)});
</script></body></html>
